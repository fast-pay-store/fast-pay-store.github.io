name: Plati daily sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plati-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Plati daily sync
        env:
          PLATI_API_KEY: ${{ secrets.PLATI_API_KEY }}
          PLATI_SELLER_ID: ${{ secrets.PLATI_SELLER_ID }}
        run: python automation/plati_daily.py

      - name: Commit report and snapshots
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [[ `git status --porcelain` ]]; then
            git commit -m "plati daily report $(date +%F)"
            git pull --rebase origin main
            git push
          else
            echo "no changes"
          fi
